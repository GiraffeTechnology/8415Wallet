name: Static artifact CI

on:
  pull_request:
    branches: [deploy/xiongan-sin]
  push:
    branches: [deploy/xiongan-sin]

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Exact revision and file checksums
        run: |
          git rev-parse HEAD
          sha256sum --check --strict SHA256SUMS
      - name: Static artifact and checksum refusal tests
        run: node --test .github/scripts/verify-static.mjs

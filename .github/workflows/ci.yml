name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  task-runtime-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup exact minimum Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci
      - name: Build and verify standalone authentication package
        run: |
          npm run pack:auth
          npm run pack:auth:verify
      - name: Import canonical task core and smoke installed service
        run: node scripts/controls/task-auth-runtime-smoke.mjs --runtime dist/package-auth

  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.18 is where Node runs TypeScript from source without a flag, which
        # is what lets this project ship with no build step. 24 guards against
        # drift on the current line.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          PRODUCT_STRICT_SMOKE_SOURCE: ${{ github.workspace }}
        run: npm test

      - name: Browser entry
        run: |
          npm run wallet:browser:build
          node --test tests/task-static-module-closure.test.mjs

      # No genuine wallet, network RPC, user keys or user signatures. Reuse the existing hosted runner;
      # this step does not provision infrastructure or establish device acceptance.
      - name: Verified wallet login browser privacy
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/login-ui-smoke.cjs

      - name: Verified wallet login browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-login-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-login-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Account authentication browser journeys
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/login-methods-ui-smoke.cjs
          node scripts/controls/method-change-ui-smoke.cjs
          node --test tests/task-authorization-browser.test.mjs
          node scripts/controls/tenant-password-ui-smoke.cjs

      - name: Account authentication browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-account-auth-browser-node-${{ matrix.node-version }}
          path: |
            /tmp/8415-auth-methods-ui-evidence
            /tmp/8415-tenant-password-ui
          if-no-files-found: ignore
          retention-days: 7

      - name: Multilingual wallet browser privacy and review invariants
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/i18n-ui-smoke.cjs

      - name: Multilingual wallet browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-i18n-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-i18n-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Approved wallet UI browser journeys
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/approved-ui-smoke.cjs

      - name: Approved wallet UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-approved-ui-node-${{ matrix.node-version }}
          path: /tmp/8415-approved-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Xiongan synthetic browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          npm run wallet:xiongan:smoke

      # The escrow holds value, so it is executed rather than only compiled:
      # hardhat runs it against the ERC-8415 reference implementation on a real
      # EVM, admitting entries through the real settlement path.
      - name: Xiongan synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiongan-synthetic-browser-node-${{ matrix.node-version }}
          path: /tmp/xiongan-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: ERC20 browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/erc20-ui-smoke.cjs

      - name: ERC20 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc20-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-erc20-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Contracts
        run: npm run test:evm

      # Runs the reference client end to end. The suites cover the view models;
      # this catches a renderer or CLI wiring break that leaves them passing.
      - name: Reference client
        run: npm run wallet > /dev/null

      - name: V2 package
        run: npm run pack:v2

      - name: V2 external install
        run: npm run pack:v2:verify

      - name: V3 package
        run: npm run pack:v3

      - name: V3 external install
        run: npm run pack:v3:verify

      - name: DApp release contract
        run: npm run test:package:dapp

      - name: V2 and V3 DApp Beta artifacts
        run: npm run pack:dapp:all

      - name: DApp artifact integrity
        run: npm run pack:dapp:verify

      - name: Reproducible DApp and source archives
        shell: bash
        run: |
          sha256sum dist/8415wallet-dapp-*.tar.gz dist/8415wallet-source-*.tar.gz > /tmp/dapp-archive-sha256
          npm run pack:dapp:all
          sha256sum --check /tmp/dapp-archive-sha256
          npm run pack:dapp:verify

      - name: Standalone settlement browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="${WALLET_BROWSER_CHROMIUM:-$(command -v google-chrome || command -v chromium)}"
          test -n "$WALLET_BROWSER_CHROMIUM"
          HARDHAT_CONFIG=hardhat.rehearsal.config.cjs node scripts/controls/settlement-ui-smoke.cjs

      - name: Standalone settlement browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-settlement-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Authentication runtime package
        run: npm run pack:auth

      - name: Authentication runtime integrity
        run: npm run pack:auth:verify

      - name: Authentication task runtime package smoke
        run: node scripts/controls/task-auth-runtime-smoke.mjs --runtime dist/package-auth

      - name: Isolated installed authentication journey
        run: npm run test:auth:installed

      - name: Reproducible authentication runtime
        shell: bash
        run: |
          sha256sum dist/8415wallet-auth-runtime-*.tar.gz > /tmp/auth-archive-sha256
          npm run pack:auth
          sha256sum --check /tmp/auth-archive-sha256
          npm run pack:auth:verify

      - name: Reusable DApp delivery kit
        run: npm run pack:delivery

      - name: Reusable DApp delivery integrity
        run: npm run pack:delivery:verify

      # Full-repository archives above remain runner-local. They can contain
      # private operations/history and must never be uploaded as public products.
      - name: Build and verify public product kit
        id: public_product
        shell: bash
        env:
          EXPECTED_UPSTREAM_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_UPSTREAM_COMMIT"
          git diff --quiet
          git diff --cached --quiet
          upstream_tree="$(git rev-parse HEAD^{tree})"
          policy_sha="$(sha256sum config/product-source-allowlist.json | cut -d ' ' -f 1)"
          tooling_sha="$(node --input-type=module -e 'import { computeToolingPin } from "./scripts/package/verify-product-origin.mjs"; console.log(computeToolingPin());')"
          common=(
            --source "$GITHUB_WORKSPACE"
            --allowlist config/product-source-allowlist.json
            --allowlist-sha256 "$policy_sha"
            --tooling-sha256 "$tooling_sha"
            --upstream-commit "$EXPECTED_UPSTREAM_COMMIT"
            --upstream-tree "$upstream_tree"
            --require-clean true
          )
          plan="$RUNNER_TEMP/8415wallet-public-product-plan.json"
          node scripts/package/build-public-product.mjs --mode plan "${common[@]}" > "$plan"
          product_tree="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).predictedProductTree)' "$plan")"
          node scripts/package/build-public-product.mjs --mode build "${common[@]}" \
            --product-tree "$product_tree" \
            --output "$RUNNER_TEMP/8415wallet-public-product-node-${{ matrix.node-version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verified public product artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: public-product-kit-node-${{ matrix.node-version }}
          path: |
            ${{ steps.public_product.outputs.archive_path }}
            ${{ steps.public_product.outputs.guide_path }}
            ${{ steps.public_product.outputs.checksums_path }}
            ${{ steps.public_product.outputs.report_path }}
          if-no-files-found: error
          retention-days: 7

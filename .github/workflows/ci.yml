name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.18 is where Node runs TypeScript from source without a flag, which
        # is what lets this project ship with no build step. 24 guards against
        # drift on the current line.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Browser entry
        run: npm run wallet:browser:build

      # No real wallet, RPC, keys or signatures. Reuse the existing hosted runner;
      # this step does not provision infrastructure or establish device acceptance.
      - name: Xiongan synthetic browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$WALLET_BROWSER_CHROMIUM"
          npm run wallet:xiongan:smoke

      # The escrow holds value, so it is executed rather than only compiled:
      # hardhat runs it against the ERC-8415 reference implementation on a real
      # EVM, admitting entries through the real settlement path.
      - name: Xiongan synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiongan-synthetic-browser-node-${{ matrix.node-version }}
          path: /tmp/xiongan-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: ERC20 browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$WALLET_BROWSER_CHROMIUM"
          node scripts/controls/erc20-ui-smoke.cjs

      - name: ERC20 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc20-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-erc20-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Contracts
        run: npm run test:evm

      # Runs the reference client end to end. The suites cover the view models;
      # this catches a renderer or CLI wiring break that leaves them passing.
      - name: Reference client
        run: npm run wallet > /dev/null

      - name: V2 package
        run: npm run pack:v2

      - name: V2 external install
        run: npm run pack:v2:verify

      - name: V3 package
        run: npm run pack:v3

      - name: V3 external install
        run: npm run pack:v3:verify

      - name: DApp release contract
        run: npm run test:package:dapp

      - name: V2 and V3 DApp Beta artifacts
        run: npm run pack:dapp:all

      - name: DApp artifact integrity
        run: npm run pack:dapp:verify

      - name: Reproducible DApp and source archives
        shell: bash
        run: |
          sha256sum dist/8415wallet-dapp-*.tar.gz dist/8415wallet-source-*.tar.gz > /tmp/dapp-archive-sha256
          npm run pack:dapp:all
          sha256sum --check /tmp/dapp-archive-sha256
          npm run pack:dapp:verify

      - name: Standalone settlement browser recovery
        shell: bash
        run: |
          export WALLET_BROWSER_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$WALLET_BROWSER_CHROMIUM"
          HARDHAT_CONFIG=hardhat.rehearsal.config.cjs node scripts/controls/settlement-ui-smoke.cjs

      - name: Standalone settlement browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-browser-node-${{ matrix.node-version }}
          path: /tmp/8415-settlement-ui-evidence
          if-no-files-found: ignore
          retention-days: 7

# Include this location in the deployment-provided TLS server block.
# Configure and preserve its server name, listener, certificates, and TLS settings separately.
location ^~ /auth/ {
    proxy_pass http://127.0.0.1:18417;
    proxy_set_header Host $http_host;
    proxy_set_header X-Wallet-Tenant $http_x_wallet_tenant;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Wallet-CSRF $http_x_wallet_csrf;
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Verified-Wallet "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 100k;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    # Do not log bodies/headers or enrollment responses. Inherit no debug logging.
}
